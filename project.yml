name: SwitchingMac

options:
  bundleIdPrefix: com.azuma71
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: ja
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 開発中はローカル実行用の ad-hoc 署名。配布時に Developer ID へ差し替える。
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"

targets:
  # ------------------------------------------------------------------
  # Core: UI に依存しないロジック層。テスト対象であり、
  #       将来 App Store 版ターゲットからも同じコードを共有する。
  # ------------------------------------------------------------------
  SwitchingMacCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SwitchingMacCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azuma71.SwitchingMacCore
        PRODUCT_NAME: SwitchingMacCore
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  # ------------------------------------------------------------------
  # App: メニューバー常駐アプリ本体（非サンドボックス版）
  # ------------------------------------------------------------------
  SwitchingMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/SwitchingMac
    dependencies:
      - target: SwitchingMacCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azuma71.SwitchingMac
        PRODUCT_NAME: SwitchingMac
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: "NO"
    info:
      path: Sources/SwitchingMac/Info.plist
      properties:
        CFBundleName: SwitchingMac
        CFBundleDisplayName: SwitchingMac
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Dock / アプリスイッチャーに出さないメニューバー常駐アプリ
        LSUIElement: true
        NSAppleEventsUsageDescription: >-
          ダークモードなど、システム設定のスイッチを切り替えるために
          「システムイベント」の操作許可が必要です。

  # ------------------------------------------------------------------
  # Tests
  # ------------------------------------------------------------------
  SwitchingMacCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SwitchingMacCoreTests
    dependencies:
      - target: SwitchingMacCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azuma71.SwitchingMacCoreTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  SwitchingMac:
    build:
      targets:
        SwitchingMac: all
        SwitchingMacCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - SwitchingMacCore
      targets:
        - SwitchingMacCoreTests
